<p class="post-meta">
  <time datetime="{{ post.date_iso }}">{{ post.date_str }}</time>
  {% if post.updated_iso %}<span class="dot">·</span><span title="最后更新">更新于 {{ post.updated_str }}</span>{% endif %}
  <span class="dot">·</span><span>{{ post.reading_time }} 分钟阅读</span>
  {% if post.categories %}
  <span class="dot">·</span>
  {% for c in post.categories %}<a class="meta-link" href="{{ root }}{{ c.url }}">{{ c.name }}</a>{% if not loop.last %}、{% endif %}{% endfor %}
  {% endif %}
</p>
